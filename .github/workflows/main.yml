name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]
        php: ['8.1', '8.3', '8.4', '8.5' ]
        laravel: [ '10.*', '11.*', '12.*', '13.*' ]
        stability: [ prefer-stable ]
        exclude:
          # Laravel 10 officially supports PHP 8.1 - 8.3
          - laravel: '10.*'
            php: '8.4'
          - laravel: '10.*'
            php: '8.5'

          # Laravel 11 officially supports PHP 8.2 - 8.4
          - laravel: '11.*'
            php: '8.1'
          - laravel: '11.*'
            php: '8.5'

          # Laravel 12 officially supports PHP 8.2 - 8.5
          - laravel: '12.*'
            php: '8.1'

          # Laravel 13 officially supports PHP 8.3 - 8.5
          - laravel: '13.*'
            php: '8.1'
          - laravel: '13.*'
            php: '8.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          cache: composer

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run static analysis
        run: vendor/bin/phpstan analyse

      - name: Ensure code structure
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest